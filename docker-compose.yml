services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arthadesk_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: arthadesk
      DB_USER: arthadesk
      DB_PASS: arthapass
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    container_name: arthadesk_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: artharoot
      MYSQL_DATABASE: arthadesk
      MYSQL_USER: arthadesk
      MYSQL_PASSWORD: arthapass
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
    driver: local
